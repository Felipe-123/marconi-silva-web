<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Marconi Silva Arquitectos. Casas a medida para familias en todo el país, también con proyectos a distancia.">
<meta property="og:title" content="Marconi Silva Arquitectos">
<meta property="og:description" content="Casas a medida, estés donde estés.">
<meta property="og:image" content="img/casa-campo.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23676665'/%3E%3Cg fill='none' stroke='white' stroke-width='2'%3E%3Crect x='10' y='30' width='16' height='12'/%3E%3Crect x='22' y='25' width='15' height='17'/%3E%3Crect x='33' y='20' width='10' height='22'/%3E%3Crect x='40' y='30' width='15' height='12'/%3E%3C/g%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Marconi Silva Arquitectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: fotos verticales grandes como protagonistas, bandas en el gris del logo, texto liviano y espaciado como en los reels. */
:root{
  --bg:#f2f1ef;        /* blanco grisado */
  --surface:#e6e5e2;   /* gris claro para bloques */
  --brand:#676665;     /* el gris del círculo del logo */
  --on-brand:#ffffff;
  --ink:#2b2b2a;
  --muted:#76746f;
  --line:#d5d3cf;

  --f:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --maxw:1320px;
  --gut:max(16px,4vw);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1c1b;--surface:#262625;--brand:#5f5e5d;--on-brand:#ffffff;--ink:#ecebe8;--muted:#a3a19c;--line:#393937;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1c1b;--surface:#262625;--brand:#5f5e5d;--on-brand:#ffffff;--ink:#ecebe8;--muted:#a3a19c;--line:#393937;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:300;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.label{font-size:12px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-weight:300;margin:0;text-wrap:balance}
.display{font-size:clamp(36px,5.4vw,76px);line-height:1.06;letter-spacing:.005em}
.h2{font-size:clamp(28px,3.2vw,44px);line-height:1.12}
p{margin:0;max-width:60ch}
.lead{font-size:clamp(19px,1.7vw,23px);line-height:1.55}
.stack{display:flex;flex-direction:column}

/* logo */
.mark{display:block;color:currentColor}
.mark path{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand .mark{width:58px;height:auto}
.brand-text{display:flex;flex-direction:column;align-items:center;line-height:1}
.brand-text b{font-weight:300;font-size:19px;letter-spacing:.04em}
.brand-text span{font-size:11.5px;letter-spacing:.14em;margin-top:5px;color:var(--muted)}
nav.main{display:flex;gap:clamp(18px,2.6vw,40px)}
nav.main a{text-decoration:none;font-size:13px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-block:4px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.menu-btn{display:none;background:none;border:0;color:var(--ink);font:inherit;font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:8px 0}
/* el menú siempre visible: en pantallas angostas va debajo del logo */
@media (max-width:1100px){
  nav.main{gap:18px}
  nav.main a{font-size:12px;letter-spacing:.12em}
}
@media (max-width:480px){
  .wide-only{display:none}
  header.site nav.main{width:100%;flex-wrap:nowrap;justify-content:space-between;gap:8px}
  header.site nav.main a{letter-spacing:.05em;white-space:nowrap}
}
@media (max-width:860px){
  header.site .wrap{flex-wrap:wrap;gap:10px 24px;padding-block:12px}
  .brand .mark{width:46px}
  .brand-text b{font-size:17px}
  nav.main{flex-wrap:wrap;gap:4px 14px}
  nav.main a{font-size:11px;letter-spacing:.1em}
}

/* vistas */
.view{animation:in .5s ease both}
@keyframes in{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

/* banda gris (color del logo) */
.band{background:var(--brand);color:var(--on-brand)}
.band .label{color:color-mix(in srgb,var(--on-brand) 72%,transparent)}
.band p{color:color-mix(in srgb,var(--on-brand) 90%,transparent)}

/* inicio: hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:min(86vh,820px)}
.hero-text{display:flex;flex-direction:column;justify-content:space-between;gap:48px;padding-block:clamp(40px,6vw,80px);padding-left:max(var(--gut),env(safe-area-inset-left,0px),calc((100vw - var(--maxw))/2 + var(--gut)));padding-right:clamp(24px,4vw,64px)}
.hero-text .mark{width:min(200px,40%);height:auto}
.hero-photo{position:relative;min-height:420px}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;text-decoration:none;font-size:13px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;padding:16px 28px;border:1px solid currentColor;transition:background .25s,color .25s}
.band .btn:hover{background:var(--on-brand);color:var(--brand)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.solid:hover{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero-text{padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
  .hero-photo{aspect-ratio:4/5;min-height:0}
}

.quote{padding-block:clamp(72px,10vw,144px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:clamp(24px,5vw,80px)}
.quote blockquote{margin:0;font-size:clamp(24px,2.8vw,38px);line-height:1.3;max-width:28em}
.quote cite{display:block;margin-top:20px;font-style:normal}
@media (max-width:820px){.quote{grid-template-columns:1fr}}

.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:clamp(24px,3vw,40px)}
.more{font-size:13px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px}

/* grilla de casas */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(36px,4vw,56px) clamp(14px,2vw,28px)}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:14px;text-decoration:none;min-width:0}
.card .ph{aspect-ratio:4/5;overflow:hidden;background:var(--surface)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.card:hover img{transform:scale(1.03)}
.card h3{font-size:20px;font-weight:300}
.card .label{font-size:11px}

/* cifras */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);border-top:1px solid color-mix(in srgb,var(--on-brand) 30%,transparent);padding-top:32px}
.facts b{display:block;font-weight:300;font-size:clamp(32px,3.6vw,52px);line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.facts{grid-template-columns:1fr}}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.pad{padding-block:clamp(64px,9vw,128px)}
.page-head{padding-block:clamp(56px,8vw,112px) clamp(36px,5vw,64px)}

/* detalle */
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);padding-block:clamp(36px,5vw,64px) clamp(56px,8vw,112px)}
.detail .ph img{width:100%;height:auto}
.detail-side{position:sticky;top:120px;align-self:start;display:flex;flex-direction:column;gap:28px}
.back{text-decoration:none}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:12px 28px;margin:0;border-top:1px solid var(--line);padding-top:20px}
.ficha dt{font-size:11.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.ficha dd{margin:0}
.pager{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:24px}
.pager a{text-decoration:none;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pager a:hover{color:var(--ink)}
@media (max-width:820px){.detail{grid-template-columns:1fr}.detail-side{position:static}}

/* el estudio (mismo bloque en inicio) */
.about-photo{aspect-ratio:4/3;overflow:hidden;background:var(--surface)}
.about-photo img{width:100%;height:100%;object-fit:cover;object-position:60% center}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(32px,5vw,80px);align-items:center}
@media (max-width:820px){.about{grid-template-columns:1fr}}
.q{margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.55;color:var(--muted);border-left:1px solid var(--line);padding-left:20px;max-width:34em}
.q cite{display:block;margin-top:10px;font-style:normal}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6vw,20px)}
.person{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.person .ph{aspect-ratio:4/5;overflow:hidden;background:var(--surface)}
.person img{width:100%;height:100%;object-fit:cover}
.person figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.person b{font-weight:300;font-size:21px}
.wide-photo{aspect-ratio:16/9;overflow:hidden;background:var(--surface)}
.wide-photo img{width:100%;height:100%;object-fit:cover}
.principles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(28px,5vw,80px)}
@media (max-width:720px){.principles{grid-template-columns:1fr}}
.principle{border-top:1px solid var(--line);padding-block:28px 36px;display:flex;flex-direction:column;gap:12px}
.principle h3{font-size:24px}
.principle p{color:var(--muted)}
.principle .who{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:400}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;padding-block:18px;border-bottom:1px solid var(--line);align-items:baseline}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:4px}}

/* a distancia */
/* banda con foto limpia de fondo y el texto en una caja gris sólida, como en los reels */
.photo-band{background:var(--brand) var(--photo) center 60%/cover no-repeat}
.photo-inner{min-height:min(80vh,720px);display:flex;align-items:flex-end;padding-block:clamp(32px,5vw,64px)}
.panel{background:var(--brand);padding:clamp(28px,3.5vw,48px);max-width:600px;gap:18px}
.panel .display{font-size:clamp(34px,4vw,58px)}
@media (max-width:820px){
  .photo-band{background-size:100% auto;background-position:center top}
  .photo-inner{min-height:0;padding-top:52vw;padding-bottom:0}
  .panel{max-width:none;margin-left:calc(-1 * max(var(--gut),env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(var(--gut),env(safe-area-inset-right,0px)))}
}

/* línea del tiempo: una línea continua con un punto por paso */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(16px,2vw,28px);counter-reset:s;position:relative}
.steps::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--ink)}
.steps li{counter-increment:s;position:relative;padding-top:36px;display:flex;flex-direction:column;gap:10px;min-width:0}
.steps li::after{content:"";position:absolute;left:0;top:0;width:13px;height:13px;border-radius:50%;background:var(--ink)}
.steps li::before{content:"Paso " counter(s);font-size:11.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@media (max-width:1000px){
  .steps{grid-template-columns:1fr;gap:36px;padding-left:36px}
  .steps::before{left:6px;right:auto;top:6px;bottom:6px;width:1px;height:auto}
  .steps li{padding-top:0}
  .steps li::after{left:-36px;top:3px}
  .steps p{max-width:48ch}
}
.steps h3{font-size:21px}
.steps p{font-size:15.5px;color:var(--muted)}
.places{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.places span{border:1px solid var(--line);padding:8px 16px;font-size:14px;letter-spacing:.06em}
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(28px,5vw,80px);align-items:center}
.story .ph{aspect-ratio:4/5;overflow:hidden}
.story img{width:100%;height:100%;object-fit:cover}
@media (max-width:820px){.story{grid-template-columns:1fr}}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding-block:22px;font-size:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;line-height:1;color:var(--muted)}
.faq details[open] summary::after{content:"–"}
.faq details p{padding-bottom:24px;color:var(--muted)}

/* contacto */
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:clamp(32px,6vw,96px);padding-bottom:clamp(64px,9vw,128px)}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.info{display:flex;flex-direction:column;gap:28px}
.info div{display:flex;flex-direction:column;gap:4px}
.info .val{font-size:20px;user-select:all;word-break:break-word}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}
@media (max-width:560px){form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:11.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--muted);padding:8px 0;border-radius:0;width:100%}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:120px}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
form .btn{grid-column:1/-1;cursor:pointer;font-family:var(--f)}
.sent{grid-column:1/-1;font-size:15px;color:var(--muted)}

/* ícono de Instagram */
.ig{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5}
.ig .dot{fill:currentColor;stroke:none}
.ig-link{display:inline-flex;align-items:center}
.ig-handle{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.ig-handle:hover{text-decoration:underline}

/* footer */
footer.site{background:var(--brand);color:var(--on-brand);border-top:1px solid color-mix(in srgb,var(--on-brand) 22%,transparent)}
footer.site .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center;padding-block:48px}
footer.site .mark{width:110px;height:auto}
footer.site .fb{display:flex;flex-direction:column;align-items:center;gap:12px}
footer.site .fb b{font-weight:300;font-size:22px;letter-spacing:.04em;line-height:1}
footer.site .fb span{font-size:13px;letter-spacing:.14em;line-height:1}
footer.site nav{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center}
footer.site a{text-decoration:none;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
footer.site a:hover{opacity:1}
footer.site small{font-size:12px;opacity:.7;text-align:right}
@media (max-width:820px){footer.site .wrap{grid-template-columns:1fr;justify-items:center;text-align:center}footer.site small{text-align:center}}
</style>
</head>
<body>

<header class="site" id="hdr">
  <div class="wrap">
    <a class="brand" href="#inicio" aria-label="Marconi Silva Arquitectos, inicio">
      <svg class="mark" data-mark viewBox="0 0 124 50" aria-hidden="true"></svg>
      <span class="brand-text"><b>MARCONI SILVA</b><span>Arquitectos</span></span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menú</button>
    <nav class="main" id="nav">
      <a href="#inicio" data-r="inicio">Inicio</a>
      <a href="#estudio" data-r="estudio">El estudio</a>
      <a href="#casas" data-r="casas">Casas</a>
      <a href="#a-distancia" data-r="a-distancia"><span class="wide-only">Proyectos </span>a distancia</a>
      <a href="#contacto" data-r="contacto">Contacto</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer class="site">
  <div class="wrap">
    <div class="fb"><svg class="mark" data-mark viewBox="0 0 124 50" aria-hidden="true"></svg><b>MARCONI SILVA</b><span>Arquitectos</span></div>
    <nav aria-label="Pie de página">
      <a href="#inicio">Inicio</a><a href="#estudio">El estudio</a><a href="#casas">Casas</a><a href="#a-distancia">A distancia</a><a href="#contacto">Contacto</a>
      <a class="ig-link" href="https://www.instagram.com/marconisilvaarquitectos/" target="_blank" rel="noopener" aria-label="Instagram de Marconi Silva Arquitectos"><svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle class="dot" cx="17.3" cy="6.7" r="1.1"/></svg></a>
    </nav>
    <small>Casas en todo el país<br>Maqueta del sitio · textos entre [ ] a completar</small>
  </div>
</footer>

<script>
(function(){
  // ---------- Isologo redibujado: cuatro rectángulos a mano alzada ----------
  const rects=[[2,22,41,24],[33,13,40,33],[61,3,26,45],[80,22,42,25]];
  const j=(n,s)=>{const x=Math.sin(n*12.9898+s*78.233)*43758.5453;return (x-Math.floor(x)-.5)*1.6};
  let d="";
  rects.forEach(([x,y,w,h],i)=>{
    for(let pass=0;pass<2;pass++){
      const k=i*10+pass*5, o=pass?0.9:0;
      d+=`M${x-1+j(k,1)} ${y+o+j(k,2)}L${x+w+1.5+j(k,3)} ${y+o*.6+j(k,4)}`;
      d+=`M${x+w+o+j(k,5)} ${y-1+j(k,6)}L${x+w+o*.5+j(k,7)} ${y+h+1.5+j(k,8)}`;
      d+=`M${x+w+1+j(k,9)} ${y+h-o+j(k,10)}L${x-1.5+j(k,11)} ${y+h-o*.4+j(k,12)}`;
      d+=`M${x+o+j(k,13)} ${y+h+1+j(k,14)}L${x+o*.6+j(k,15)} ${y-1.5+j(k,16)}`;
    }
  });
  document.querySelectorAll("[data-mark]").forEach(s=>s.innerHTML=`<path d="${d}"/>`);
  const markSvg=`<svg class="mark" viewBox="0 0 124 50" aria-hidden="true"><path d="${d}"/></svg>`;

  // ---------- Casas (fotos del Drive del estudio; datos a completar) ----------
  const casas=[
    {id:"casa-campo",n:"Casa de campo",img:"casa-campo"},
    {id:"casa-pinos",n:"Casa entre pinos",img:"casa-pinos"},
    {id:"casa-blanca",n:"Casa blanca con galería",img:"casa-blanca-galeria"},
    {id:"casa-piscina",n:"Casa con piscina y piedra",img:"casa-piscina-piedra"},
    {id:"casa-cipreses",n:"Casa entre cipreses",img:"casa-cipreses"},
    {id:"casa-terrazas",n:"Casa con terrazas",img:"casa-terrazas"},
    {id:"casa-dos-plantas",n:"Casa en dos plantas",img:"casa-dos-plantas"},
    {id:"casa-piedra",n:"Casa de piedra y tejas",img:"casa-piedra-tejas"},
    {id:"casa-sierra",n:"Casa en la sierra",img:"casa-sierra"}
  ];
  const src=k=>`img/${k}.jpg`;
  // Mismo texto en Inicio y en El estudio
  const sobre="Somos Juan y Fran. Diseñamos casas a medida para familias en todo el país y en países limítrofes.";
  const card=c=>`<a class="card" href="#${c.id}"><div class="ph"><img src="${src(c.img)}" alt="${c.n}" loading="lazy"></div><div class="stack" style="gap:4px"><h3>${c.n}</h3><span class="label">[Ubicación] · [Año]</span></div></a>`;

  const views={
    inicio:()=>`
      <section class="band hero">
        <div class="hero-text">
          ${markSvg}
          <div class="stack" style="gap:28px">
            <h1 class="display">Casas a medida,<br>estés donde estés.</h1>
            <p class="lead">Diseñamos cada casa a partir de cómo vive cada familia: sus hábitos, sus gustos y su historia.</p>
            <a class="btn" href="#contacto">Empezá tu proyecto <span aria-hidden="true">→</span></a>
          </div>
        </div>
        <div class="hero-photo"><img src="${src("casa-campo")}" alt="Casa de campo baja con galerías, rodeada de pastos"></div>
      </section>

      <section class="wrap pad about">
        <div class="stack" style="gap:24px">
          <span class="label">El estudio</span>
          <h2 class="h2">${sobre}</h2>
          <blockquote class="q">“La casa nunca es la primera reunión: tiene que mutar, como un traje hecho a medida. Tu casa tiene que ser tuya, no nuestra primera propuesta.”<cite class="label">Fran</cite></blockquote>
          <a class="more" href="#estudio" style="align-self:flex-start">Conocé el estudio</a>
        </div>
        <div class="about-photo"><img src="${src("juan-y-fran")}" alt="Juan y Fran, directores del estudio, sentados a una mesa" loading="lazy"></div>
      </section>

      <section class="wrap" style="padding-bottom:clamp(72px,10vw,144px)">
        <div class="section-head"><h2 class="h2">Casas</h2><a class="more" href="#casas">Ver todas</a></div>
        <div class="grid">${casas.slice(0,6).map(card).join("")}</div>
      </section>

      <section class="band"><div class="wrap pad stack" style="gap:clamp(40px,5vw,64px)">
        <div class="split">
          <div class="stack" style="gap:16px"><span class="label">Proyectos a distancia</span><h2 class="h2">¿Tu terreno está lejos? Tu casa la podemos diseñar igual.</h2></div>
          <div class="stack" style="gap:28px"><p class="lead">Nos reunimos por Zoom, en dos o tres meses tenemos el proyecto y lo confirmamos con una maqueta 3D donde ves toda la casa antes de construirla.</p><a class="btn" href="#a-distancia">Cómo trabajamos <span aria-hidden="true">→</span></a></div>
        </div>
        <div class="facts">
          <div><b>2 a 3 meses</b><p>para tener el proyecto</p></div>
          <div><b>Cada 10 días</b><p>una reunión por Zoom</p></div>
          <div><b>20 a 30 obras</b><p>hechas en distintos lugares del país</p></div>
        </div>
      </div></section>`,

    casas:()=>`
      <section class="wrap page-head split">
        <h1 class="display">Casas</h1>
        <p class="lead">No tenemos casas preestablecidas. Cada proyecto sale de un terreno, una familia y una forma de vivir.</p>
      </section>
      <section class="wrap" style="padding-bottom:clamp(72px,10vw,144px)"><div class="grid">${casas.map(card).join("")}</div></section>`,

    estudio:()=>`
      <section class="wrap page-head split">
        <h1 class="display">El estudio</h1>
        <div class="stack" style="gap:20px">
          <p class="lead">${sobre}</p>
          <p>No queremos ser el estudio que te hace lo que quiere. Escuchamos lo que querés para que, en el primer plano, reconozcas que fuiste escuchado.</p>
        </div>
      </section>
      <section class="wrap"><div class="wide-photo"><img src="${src("juan-y-fran")}" alt="Juan y Fran, directores del estudio, sentados a una mesa" loading="lazy"></div></section>
      <section class="wrap pad">
        <div class="section-head"><h2 class="h2">Cómo pensamos una casa</h2></div>
        <div class="principles">
          <div class="principle"><span class="who">A medida</span><h3>Traé la foto</h3><p>¿Te encantó el baño de un hotel o un lugarcito en la Toscana? Sacale una foto y traela a la primera reunión. Lo decodificamos juntos y lo llevamos a tu casa.</p></div>
          <div class="principle"><span class="who">Flexibles</span><h3>Casas que se adaptan</h3><p>Cocinar mientras un amigo se sienta a charlar, que los chicos hagan la tarea al lado tuyo, o integrar living, galerías y patio cuando son muchos. Una vez entraron 90 invitados.</p></div>
          <div class="principle"><span class="who">Materiales</span><h3>Por qué ladrillo</h3><p>Con una pared hueca no sabés cómo está construida la casa ni cómo va a durar. Elegimos el ladrillo como inversión: nadie te lo va a tirar abajo en el precio.</p></div>
          <div class="principle"><span class="who">Obra</span><h3>Con quién construimos</h3><p>No trabajamos con el más barato, trabajamos con el más afín. A quienes construyen nuestras casas los elegimos desde el lado de la persona.</p></div>
        </div>
      </section>
      <section class="wrap" style="padding-bottom:clamp(72px,10vw,144px)">
        <div class="section-head"><h2 class="h2">Prensa</h2></div>
        <div class="rows">
          <div class="row"><span class="label">2021</span><span>Entrevista con Jesús Pacheco</span><span class="label">Instagram</span></div>
          <div class="row"><span class="label">[Año]</span><span>[Publicación o premio]</span><span class="label">[Medio]</span></div>
        </div>
      </section>`,

    "a-distancia":()=>`
      <section class="band photo-band" style="--photo:url('img/casa-pileta-horizontal.jpg')"><div class="wrap photo-inner">
        <div class="panel stack">
          <span class="label">Proyectos a distancia</span><h1 class="display">Tu casa, desde donde estés.</h1>
          <p class="lead">¿Vivís en Ushuaia, en Calamuchita o en cualquier otro lugar del país? Diseñamos tu casa por Zoom y la construye un equipo de tu zona, con nuestro acompañamiento.</p>
          <p>El proyecto a distancia nació en la cuarentena. Las reuniones pasaron a ser online y nos dimos cuenta de que podíamos llevar nuestros proyectos mucho más lejos.</p>
        </div>
      </div></section>

      <section class="wrap pad stack" style="gap:clamp(36px,4vw,56px)">
        <h2 class="h2">Cómo trabajamos</h2>
        <ol class="steps">
          <li><h3>Nos escribís</h3><p>Por WhatsApp. Te contestamos nosotros y armamos una primera reunión.</p></li>
          <li><h3>Primera reunión</h3><p>Hablamos de tu terreno, tu familia y cómo te gusta vivir. Traé fotos de lugares que te encantaron.</p></li>
          <li><h3>Diseño</h3><p>Dos a tres meses, con una reunión por Zoom cada diez días. Probamos varias opciones: es mejor probar en papel que en la obra.</p></li>
          <li><h3>Maqueta 3D</h3><p>Vos, nosotros y quien construye vemos exactamente la misma casa antes de empezar.</p></li>
          <li><h3>Obra</h3><p>La construyen profesionales de tu zona. La acompañamos por WhatsApp y, si hace falta, coordinamos visitas.</p></li>
        </ol>
      </section>

      <section class="wrap story" style="padding-bottom:clamp(64px,9vw,128px)">
        <div class="ph"><img src="${src("casa-pinos")}" alt="Casa blanca entre pinos" loading="lazy"></div>
        <div class="stack" style="gap:24px">
          <span class="label">Una historia · Necochea</span>
          <h2 class="h2">Su casa empezó arriba de un árbol</h2>
          <p class="lead">Un cliente quería hacer su casa en el campo de su familia. De chico llegaba a caballo y desde ahí veía el mar. Fuimos juntos, se trepó a un árbol y nos dijo: desde acá veo el mar.</p>
          <p>Esa altura fue el nivel del piso del living, y a partir de ahí se armó toda la casa.</p>
        </div>
      </section>

      <section class="band"><div class="wrap pad split">
        <div class="stack" style="gap:16px"><span class="label">Dónde trabajamos</span><h2 class="h2">Casas en todo el país</h2></div>
        <div>
          <p class="lead">Entre 20 y 30 obras hechas en distintos lugares, y se siguen sumando.</p>
          <div class="places"><span>Punta del Este</span><span>Salta</span><span>Córdoba</span><span>Río Negro</span><span>Bariloche</span><span>Mendoza</span><span>Necochea</span></div>
        </div>
      </div></section>

      <section class="wrap pad split">
        <h2 class="h2">Preguntas frecuentes</h2>
        <div class="faq">
          <details open><summary>¿Hay que tener el terreno comprado?</summary><p>No siempre. Muchas veces conviene charlarlo antes. Contanos qué barrios o lotes estás mirando y hacemos una primera lectura de cada opción: pros y contras, reglamentación y orientación.</p></details>
          <details><summary>¿Cuánto tarda el proyecto?</summary><p>Entre dos y tres meses, con reuniones por Zoom cada diez días.</p></details>
          <details><summary>¿Quién construye la casa?</summary><p>Profesionales de tu zona. Nosotros acompañamos la obra de cerca: un video por WhatsApp, una consulta, una respuesta rápida, y la obra sigue.</p></details>
          <details><summary>¿Y si no puedo hacer toda la casa ahora?</summary><p>Es preferible soñarla en grande y hacerla por etapas. Un living no se agranda un metro después, pero una suite o un escritorio se pueden sumar más adelante.</p></details>
        </div>
      </section>
      <section class="wrap" style="padding-bottom:clamp(72px,10vw,144px)"><a class="btn solid" href="#contacto">Consultá por tu proyecto <span aria-hidden="true">→</span></a></section>`,

    contacto:()=>`
      <section class="wrap page-head split">
        <h1 class="display">Contacto</h1>
        <p class="lead">Contanos sobre tu terreno, tu familia y cómo te gusta vivir. Te contestamos nosotros.</p>
      </section>
      <section class="wrap contact">
        <div class="info">
          <div><span class="label">WhatsApp</span><span class="val">[+54 9 11 0000 0000]</span></div>
          <div><span class="label">Correo</span><span class="val">[correo@estudio.com]</span></div>
          <div><span class="label">Estudio</span><span class="val">[Dirección], Buenos Aires</span></div>
          <div><span class="label">Instagram</span><a class="val ig-handle" href="https://www.instagram.com/marconisilvaarquitectos/" target="_blank" rel="noopener"><svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle class="dot" cx="17.3" cy="6.7" r="1.1"/></svg>@marconisilvaarquitectos</a></div>
        </div>
        <form id="form" novalidate>
          <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" name="nombre" autocomplete="name"></div>
          <div class="field"><label for="f-email">Correo</label><input id="f-email" name="email" type="email" autocomplete="email"></div>
          <div class="field"><label for="f-tipo">Tipo de proyecto</label>
            <select id="f-tipo" name="tipo"><option>Casa nueva</option><option>Proyecto a distancia</option><option>Ampliación por etapas</option><option>Todavía estoy eligiendo terreno</option></select></div>
          <div class="field"><label for="f-lugar">¿Dónde está el terreno?</label><input id="f-lugar" name="lugar"></div>
          <div class="field full"><label for="f-msg">Contanos tu proyecto</label><textarea id="f-msg" name="mensaje"></textarea></div>
          <button class="btn solid" type="submit">Enviar consulta</button>
          <p class="sent" id="sent" hidden></p>
        </form>
      </section>`
  };

  function detail(id){
    const i=casas.findIndex(c=>c.id===id), c=casas[i];
    const prev=casas[(i-1+casas.length)%casas.length], next=casas[(i+1)%casas.length];
    return `
      <section class="wrap detail">
        <div class="ph"><img src="${src(c.img)}" alt="${c.n}"></div>
        <aside class="detail-side">
          <a class="label back" href="#casas">← Casas</a>
          <h1 class="display" style="font-size:clamp(34px,4vw,56px)">${c.n}</h1>
          <dl class="ficha">
            <dt>Ubicación</dt><dd>[Completar]</dd>
            <dt>Año</dt><dd>[Completar]</dd>
            <dt>Superficie</dt><dd>[000] m² cubiertos</dd>
            <dt>Modalidad</dt><dd>[Presencial / A distancia]</dd>
          </dl>
          <p>[Historia del proyecto: el terreno, la familia y la idea que ordenó la casa.]</p>
          <a class="btn solid" href="#contacto">Quiero una casa así <span aria-hidden="true">→</span></a>
          <nav class="pager" aria-label="Otras casas"><a href="#${prev.id}">← ${prev.n}</a><a href="#${next.id}">${next.n} →</a></nav>
        </aside>
      </section>`;
  }

  // ---------- Router por hash ----------
  const app=document.getElementById("app"), hdr=document.getElementById("hdr"), btn=document.getElementById("menuBtn");
  function render(){
    let r=(location.hash||"#inicio").slice(1), html, navKey;
    if(r==="nosotros") r="estudio";
    navKey=r;
    if(casas.some(c=>c.id===r)){html=detail(r);navKey="casas"}
    else if(views[r]){html=views[r]()}
    else {html=views.inicio();navKey="inicio"}
    app.innerHTML=`<div class="view">${html}</div>`;
    document.querySelectorAll("nav.main a").forEach(a=>{a.dataset.r===navKey?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
    hdr.classList.remove("open");btn.setAttribute("aria-expanded","false");
    window.scrollTo(0,0);
    const f=document.getElementById("form");
    if(f) f.addEventListener("submit",e=>{
      e.preventDefault();
      const s=document.getElementById("sent"), n=f.nombre.value.trim(), m=f.email.value.trim();
      s.hidden=false;
      s.textContent=(!n||!m.includes("@"))?"Completá tu nombre y un correo válido para que podamos responderte.":"En el sitio final esta consulta llega al estudio. En la maqueta no se envía.";
    });
  }
  btn.addEventListener("click",()=>{const o=hdr.classList.toggle("open");btn.setAttribute("aria-expanded",o)});
  window.addEventListener("hashchange",render);
  render();
})();
</script>

</body>
</html>
